name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Import check
        run: TRAME_DRIVER=mock python -c "import run; print('backend import OK')"
      - name: Tests
        timeout-minutes: 5
        run: python -m pytest -q tests -o faulthandler_timeout=60
