name: Release (Windows)

# Release automatique en versionnage sémantique : après chaque CI verte sur main, la
# version suivante est déduite des commits (Conventional Commits), puis l'installeur
# Windows est construit et publié en Release GitHub avec le manifeste de mise à jour.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Incrément (auto = déduit des commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Compute next semantic version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/next-version.sh

  tauri:
    name: Tauri build
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend sidecar (PyInstaller)
        shell: pwsh
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name trame-backend `
            --collect-submodules uvicorn `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --collect-all uiautomation `
            --collect-submodules opentelemetry `
            --copy-metadata opentelemetry-api `
            --copy-metadata opentelemetry-sdk `
            --copy-metadata opentelemetry-exporter-otlp-proto-http `
            --collect-submodules comtypes `
            --add-data "..\config.json;." `
            --add-data "..\SOUL.md;." `
            --add-data "..\ENTOURAGE.json;." `
            run.py
          New-Item -ItemType Directory -Force -Path ..\ui\src-tauri\binaries | Out-Null
          Copy-Item dist\trame-backend.exe ..\ui\src-tauri\binaries\trame-backend-x86_64-pc-windows-msvc.exe

      # Le moteur compilé doit démarrer et répondre, avec le vrai pilote Windows
      # (sans Teams sur le runner : auto-test en échec, mais API debout).
      - name: Smoke test packaged engine
        shell: pwsh
        run: |
          $env:TRAME_HOME = Join-Path $env:RUNNER_TEMP "trame-smoke"
          $env:TRAME_BRAIN = "mock"
          $env:TRAME_OTEL_FILE = "1"
          $p = Start-Process -FilePath backend\dist\trame-backend.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8731/api/state; $ok = $true } catch {}
          }
          Get-Content (Join-Path $env:TRAME_HOME "backend.log") -ErrorAction SilentlyContinue | Select-Object -Last 40
          taskkill /T /F /PID $p.Id | Out-Null
          if (-not $ok) { Write-Error "Le moteur empaqueté ne répond pas sur 127.0.0.1:8731"; exit 1 }
          if (-not (Test-Path (Join-Path $env:TRAME_HOME "otel.jsonl"))) { Write-Error "OpenTelemetry ne démarre pas dans le moteur empaqueté"; exit 1 }
          Write-Host "Moteur OK, auto-test Teams : $($r.selftest_ok)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install UI deps
        run: npm ci
        working-directory: ui

      - name: Generate app icons
        run: npm run tauri icon src-tauri/icons/source.png
        working-directory: ui

      - name: Changelog (nouveautés affichées dans l'appli)
        shell: pwsh
        run: node .github/scripts/changelog.mjs --next $env:VERSION

      - name: Set app version
        shell: pwsh
        run: |
          $v = $env:VERSION
          $path = "src-tauri/tauri.conf.json"
          (Get-Content $path -Raw) -replace '"version":\s*"[^"]+"', ('"version": "' + $v + '"') | Set-Content $path -Encoding utf8NoBOM
        working-directory: ui

      # Mises à jour signées : sans la clé (secret absent), on construit l'installeur
      # sans artefacts de mise à jour plutôt que d'échouer.
      - name: Tauri build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run tauri build
          } else {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY absent : installeur sans mise à jour automatique."
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content src-tauri/no-updater.json -Encoding utf8NoBOM
            npm run tauri build -- --config src-tauri/no-updater.json
          }
        working-directory: ui

      - name: Updater manifest (latest.json)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = "$($setup.FullName).sig"
          if (-not (Test-Path $sig)) { Write-Host "::warning::Pas de signature : latest.json non publié."; exit 0 }
          $v = $env:VERSION
          $name = $setup.Name -replace ' ', '.'
          # Les notes portent tout le changelog (JSON) : l'appli installée affiche ce qui
          # a changé depuis sa version avant de proposer l'installation (LED de l'en-tête).
          $notes = Get-Content src/changelog.json -Raw
          $manifest = [ordered]@{
            version = $v
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $sig -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/$name"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content src-tauri/target/release/bundle/latest.json -Encoding utf8
        working-directory: ui

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: trame-windows
          path: |
            ui/src-tauri/target/release/bundle/**/*.msi
            ui/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Trame ${{ env.TAG }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ui/src-tauri/target/release/bundle/msi/*.msi
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/nsis/*.exe.sig
            ui/src-tauri/target/release/bundle/latest.json
